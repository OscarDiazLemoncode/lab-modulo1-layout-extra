<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lemoncode layout extra</title>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Color theme -->
  <meta name="theme-color" content="#295427" />
  <meta name="theme-color" content="#295427" media="(prefers-color-scheme: dark)" />
  <!-- CSS -->
  <link rel="stylesheet" href="scss/index.scss">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header__content">
      <div class="header__content__toolbar">
        <div class="header__toolbar__input">
          <label for="search"></label>
          <input type="text" name="search" id="search" placeholder="Buscar">
        </div>
        <div class="header__toolbar__name">Nombre usuario</div>
      </div>
      <div class="header__content__title_site">
        <h1>Welcome Lemoncoders!</h1>
      </div>
    </div>
  </header>
  <div class="content">
    <!-- Nav -->
    <nav class="nav">
      <div class="nav__content">
        <div class="nav__content__title">
          <h2>Frameworks</h2>
        </div>
        <ul class="nav__content__menu">
          <li><a href="#/">React</a></li>
          <li><a href="#/">Svelte</a></li>
          <li><a href="#/">Vue</a></li>
          <li><a href="#/">Angular</a></li>
        </ul>
      </div>
    </nav>
    <!-- Main -->
    <main class="main">
      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/antonio-contreras.png" alt="Antonio Contreras" title="Antonio Contreras">
          </div>
          <div class="card__content__title">
            <h3>Antonio Contreras</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/braulio-diez.jpg" alt="Braulio Diez" title="Braulio Diez">
          </div>
          <div class="card__content__title">
            <h3>Braulio Diez</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/daniel-sanchez.jpg" alt="Daniel Sanchez" title="Daniel Sanchez">
          </div>
          <div class="card__content__title">
            <h3>Daniel Sanchez</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/francisco-mazzoni.jpg" alt="Francisco Mazzoni" title="Francisco Mazzoni">
          </div>
          <div class="card__content__title">
            <h3>Francisco Mazzoni</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/jaime-salas.png" alt="Jaime Salas" title="Jaime Salas">
          </div>
          <div class="card__content__title">
            <h3>Jaime Salas</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/javier-calzado.jpg" alt="Javier Calzado" title="Javier Calzado">
          </div>
          <div class="card__content__title">
            <h3>Javier Calzado</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/jose-manuel.png" alt="Jose Manuel" title="Jose Manuel">
          </div>
          <div class="card__content__title">
            <h3>Jose Manuel</h3>
          </div>

          </div>
          <div class="card__content__title">
            <h3>Juan Martinez</h3>

          <div class="card__content__img">
            <img src="./assets/images/santiago-camargo.jpg" alt="Santiago Camargo" title="Santiago Camargo">
          </div>
          <div class="card__content__title">
            <h3>Santiago Camargo</h3>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__content">
          <div class="card__content__img">
            <img src="./assets/images/victor-borrego.jpg" alt="Victor Borrego" title="Victor Borrego">
          </div>
          <div class="card__content__title">
            <h3>Victor Borrego</h3>
          </div>
        </div>
      </div>


    </main>
  </div>
  <!-- Footer -->
  <footer class="footer">
    <div class="footer__content">
      <h2 class="footer__content__title">Master Lemoncode</h2>
    </div>
  </footer>

</html>
